# Two-factor auth is fully driven by SolidWorxPlatformBundle. When
# `platform.security.two_factor.enabled` is set in `platform.yaml`, the platform
# prepends the necessary `scheb_two_factor` configuration (TOTP, email, backup
# codes, trusted devices, custom templates and renderers).
#
# Add overrides under `scheb_two_factor:` here only if the platform defaults are
# not what you need.
