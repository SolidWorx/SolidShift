security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # The "platform_user" provider is prepended by SolidWorxPlatformBundle and rewired by
    # its compiler pass to use the class declared in platform.yaml (`platform.models.user`).
    # We override it here to add the lookup property — App\Entity\User stores the email in
    # the `username` column, so Doctrine needs an explicit property to load by.
    providers:
        platform_user:
            entity:
                class: App\Entity\User
                property: username
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: platform_user
            form_login:
                login_path: /login
                check_path: /login
                username_parameter: username
                password_parameter: password
                csrf_parameter: _csrf_token
                csrf_token_id: authenticate
                enable_csrf: true
            logout:
                path: app_logout

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/s/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # In tests we want fast (insecure) hashes.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
